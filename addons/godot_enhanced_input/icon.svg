<svg width="128" height="128" viewBox="0 0 128 128" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Godot Enhanced Input</title>
  <rect width="128" height="128" rx="24" fill="#1e293b"/>
  <!-- A stick ring with an arrow: input becoming a direction. -->
  <circle cx="46" cy="64" r="26" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="52" cy="58" r="11" fill="#e2e8f0"/>
  <!-- Three keys stepping up: idle, ongoing, triggered. -->
  <rect x="80" y="74" width="12" height="16" rx="3" fill="#475569"/>
  <rect x="96" y="62" width="12" height="28" rx="3" fill="#f59e0b"/>
  <rect x="112" y="46" width="12" height="44" rx="3" fill="#4ade80" transform="translate(-4 0)"/>
</svg>
